<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payme World - Inloggen</title>
</head>
<body style="font-family: sans-serif; background-color: #f4f6f9; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 80vh;">

    <div style="background-color: white; padding: 30px; border-radius: 8px; width: 350px; border: 1px solid #ccc; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center;">
        <h2 style="color: #0d3b66; margin-top: 0;">Payme World 🌐</h2>
        <h3>Inloggen</h3>

        <form id="loginForm">
            <p style="text-align: left; margin-bottom: 5px; font-weight: bold;">Telefoonnummer:</p>
            <input type="text" id="phone" required placeholder="Bijv. 0612345678" style="width: 100%; padding: 10px; margin-bottom: 15px;">

            <p style="text-align: left; margin-bottom: 5px; font-weight: bold;">Wachtwoord:</p>
            <input type="password" id="password" required placeholder="Wachtwoord" style="width: 100%; padding: 10px; margin-bottom: 20px;">

            <button type="submit" style="width: 100%; padding: 12px; background-color: #137A88; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer;">Inloggen</button>
        </form>

        <p style="font-size: 14px;">Nog geen account? <a href="register.html" style="color: #137A88; font-weight: bold;">Registreer hier</a></p>
    </div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const phone = document.getElementById('phone').value;
    const password = document.getElementById('password').value;

    try {
        const response = await fetch('https://payme-world.onrender.com/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone, password })
        });

        const data = await response.json();

        if (response.ok) {
            localStorage.setItem('token', data.token);
            window.location.href = 'dashboard.html';
        } else {
            alert(data.error || 'Inloggen mislukt.');
        }
    } catch (err) {
        alert('Kon geen verbinding maken met de live server.');
    }
});
</script>
</body>
</html>
