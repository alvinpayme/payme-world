<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const phone = document.getElementById('phone').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('https://payme-world.onrender.com/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, password })
            });

            const data = await response.json();

            if (response.ok) {
                alert('Account succesvol aangemaakt! Je kunt nu inloggen.');
                window.location.href = 'login.html';
            } else {
                alert('Fout: ' + (data.error || 'Registratie mislukt.'));
            }
        } catch (error) {
            console.error(error);
            alert('Kon geen verbinding maken met de live server.');
        }
    });
</script>
