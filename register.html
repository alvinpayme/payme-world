<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payme World - Registreren</title>
</head>
<body style="font-family: sans-serif; background-color: #f4f6f9; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 80vh;">

    <div style="background-color: white; padding: 30px; border-radius: 8px; width: 350px; border: 1px solid #ccc; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center;">
        <h2 style="color: #0d3b66; margin-top: 0;">Payme World 🌐</h2>
        <h3>Account Aanmaken</h3>
        <form id="registerForm">
            <p style="text-align: left; margin-bottom: 5px; font-weight: bold;">Telefoonnummer:</p>
            <input type="text" id="phone" required placeholder="Bijv. 0612345678" style="width: 100%; padding: 10px; margin-bottom: 15px; box-sizing: border-box; font-size: 16px;">

            <p style="text-align: left; margin-bottom: 5px; font-weight: bold;">Wachtwoord:</p>
            <input type="password" id="password" required placeholder="Kies een wachtwoord" style="width: 100%; padding: 10px; margin-bottom: 20px; box-sizing: border-box; font-size: 16px;">

            <button type="submit" style="width: 100%; padding: 12px; background-color: #2ecc71; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 15px;">Registreren</button>
        </form>
        <p style="font-size: 14px; margin-bottom: 0;">Al een account? <a href="login.html" style="color: #1a73e8; text-decoration: none; font-weight: bold;">Log hier in</a></p>
    </div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const phone = document.getElementById('phone').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('https://onrender.com', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, password })
            });

            const data = await response.json();

            if (response.ok) {
                alert('Account succesvol aangemaakt! Je kunt nu inloggen.');
                window.location.href = 'login.html';
            } else {
                alert('Fout: ' + (data.error || 'Registratie mislukt.'));
            }
        } catch (error) {
            console.error(error);
            alert('Kon geen verbinding maken met de live server.');
        }
    });
</script>
</body>
</html>
