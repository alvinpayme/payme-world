<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Payme World - Registreren</title>
</head>
<body>
  <h1>Payme World</h1>
  <h2>Registreren</h2>

  <form id="registerForm">
    <label>Telefoonnummer:</label><br>
    <input type="text" id="phone" placeholder="Bijv: 06 12345678" required><br><br>

    <label>Wachtwoord:</label><br>
    <input type="password" id="password" placeholder="Wachtwoord" required><br><br>

    <button type="submit">Account aanmaken</button>
  </form>

  <p>Al een account? <a href="login.html">Log hier in</a></p>

  <script>
    const API_BASE = "https://payme-world.onrender.com";

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value.trim();

      try {
        const res = await fetch(`${API_BASE}/auth/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone, password })
        });

        const data = await res.json();

        if (!res.ok) {
          alert(data.error || "Registratie mislukt");
          return;
        }

        alert("Account succesvol aangemaakt. Je kunt nu inloggen.");
        window.location.href = "login.html";
      } catch (err) {
        alert("Er ging iets mis bij het registreren.");
      }
    });
  </script>
</body>
</html>
