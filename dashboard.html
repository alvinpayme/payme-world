<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payme World - Dashboard</title>
</head>
<body style="font-family: sans-serif; background-color: #f4f6f9; padding: 20px;">

    <div style="background-color: #0d3b66; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-radius: 8px;">
        <h2>Payme World 🌐 Dashboard</h2>
        <button onclick="logout()" style="background-color: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold;">Uitloggen</button>
    </div>

    <div style="margin-top: 20px; display: flex; gap: 20px; flex-wrap: wrap;">
        <!-- SALDO KAART -->
        <div style="background: linear-gradient(135deg, #1a73e8, #0d3b66); color: white; padding: 25px; border-radius: 8px; width: 300px; text-align: center;">
            <h3>Jouw Saldo</h3>
            <h1 id="balanceDisplay" style="font-size: 32px; margin: 10px 0;">SRD 0,00</h1>
        </div>

        <!-- FORMULIER KAART -->
        <div style="background-color: white; padding: 25px; border-radius: 8px; width: 350px; border: 1px solid #ccc;">
            <h3 style="margin-top: 0;">Geld Versturen</h3>
            <form id="transferForm">
                <p style="margin-bottom: 5px; font-weight: bold;">Telefoonnummer Ontvanger:</p>
                <input type="text" id="recipient" required placeholder="Bijv. 0612345678" style="width: 100%; padding: 10px; margin-bottom: 15px; box-sizing: border-box;">

                <p style="margin-bottom: 5px; font-weight: bold;">Valuta:</p>
                <select id="currency" style="width: 100%; padding: 10px; margin-bottom: 15px; box-sizing: border-box;">
                    <option value="SRD">Surinaamse Dollar (SRD)</option>
                    <option value="EUR">Euro (€)</option>
                    <option value="USD">Amerikaanse Dollar ($)</option>
                </select>

                <p style="margin-bottom: 5px; font-weight: bold;">Bedrag:</p>
                <input type="number" id="amount" required min="1" step="0.01" placeholder="0.00" style="width: 100%; padding: 10px; margin-bottom: 20px; box-sizing: border-box;">

                <button type="submit" style="width: 100%; padding: 12px; background-color: #1a73e8; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer;">Nu Overmaken</button>
            </form>
        </div>
    </div>

<script>
    const token = localStorage.getItem('token');
    if (!token) { window.location.href = 'login.html'; }

    async function getBalance() {
        try {
            const response = await fetch('https://onrender.com', {
                method: 'GET',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();
            if (response.ok) { document.getElementById('balanceDisplay').innerText = `SRD ${data.balance.toFixed(2)}`; }
        } catch (e) { console.error(e); }
    }

    document.getElementById('transferForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const recipient_phone = document.getElementById('recipient').value;
        const amount = document.getElementById('amount').value;
        const currency = document.getElementById('currency').value;

        try {
            const response = await fetch('https://onrender.com', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ recipient_phone, amount, currency })
            });
            const data = await response.json();
            if (response.ok) {
                alert(`Succesvol ${currency} ${amount} overgemaakt!`);
                getBalance();
                document.getElementById('transferForm').reset();
            } else { alert('Fout: ' + (data.error || 'Transactie mislukt.')); }
