<script>
const token = localStorage.getItem('token');

if (!token) {
    window.location.href = "login.html";
}

async function loadDashboard() {
    try {
        const response = await fetch("https://onrender.com", {
            method: "GET",
            headers: {
                "Authorization": `Bearer ${token}`
            }
        });

        const data = await response.json();

        if (!response.ok) {
            localStorage.removeItem("token");
            window.location.href = "login.html";
            return;
        }

        document.getElementById("welcomeText").innerText = `Welkom terug!`;
        document.getElementById("userPhone").innerText = data.phone;
        document.getElementById("userBalance").innerText = data.balance;

    } catch (err) {
        alert("Kon geen verbinding maken met de live server.");
    }
}

loadDashboard();

document.getElementById("logoutBtn").addEventListener("click", () => {
    localStorage.removeItem("token");
    window.location.href = "login.html";
});
</script>
