<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Payme World - Dashboard</title>
</head>
<body>
  <h1>Payme World</h1>
  <h2>Dashboard</h2>

  <p>Telefoonnummer: <span id="userPhone"></span></p>
  <p>Saldo: € <span id="userBalance"></span></p>

  <button id="logoutBtn">Uitloggen</button>

  <script>
    const API_BASE = "https://payme-world.onrender.com";
    const token = localStorage.getItem("token");

    if (!token) {
      window.location.href = "login.html";
    }

    async function loadUser() {
      try {
        const res = await fetch(`${API_BASE}/auth/me`, {
          method: "GET",
          headers: {
            "Authorization": `Bearer ${token}`
          }
        });

        const data = await res.json();

        if (!res.ok) {
          localStorage.removeItem("token");
          window.location.href = "login.html";
          return;
        }

        document.getElementById("userPhone").innerText = data.phone;
        document.getElementById("userBalance").innerText = data.balance;
      } catch (err) {
        alert("Er ging iets mis bij het laden van je gegevens.");
        localStorage.removeItem("token");
        window.location.href = "login.html";
      }
    }

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("token");
      window.location.href = "login.html";
    });

    loadUser();
  </script>
</body>
</html>
